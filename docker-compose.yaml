version: "3.8"
services:
  jenkins:
    container_name: jenkins
    image: AlexGC/jenkins:latest
    build:
      context: jenkins_docker
    ports:
      - 8090:8080
    user: "root:jenkins"
    volumes:
      - $PWD/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - net
networks:
  net:
